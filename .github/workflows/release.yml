name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- theme.css
      - run: npm test
      - run: npm run check
      - run: npm run visual:h5 -- --verify-approval --require-approval
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          theme.css manifest.json
          --draft
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --generate-notes
